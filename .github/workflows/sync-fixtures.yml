# Polls the Discord fixtures channel through the site every 10 minutes.
# Repo secrets needed: SITE_URL (e.g. https://ftp-stats.vercel.app) and CRON_SECRET (same value as on the site).
name: Sync fixtures from Discord
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ vars.SYNC_ENABLED != 'false' }}
    steps:
      - name: Call the sync endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "SITE_URL / CRON_SECRET secrets not set"; exit 0; fi
          curl --fail --silent --show-error -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/sync/discord"
